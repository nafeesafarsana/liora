{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LIORA Admin{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'admin_panel/css/admin.css' %}">
{% block extra_css %}{% endblock %}
</head>
<body class="admin-body {% block body_class %}{% endblock %}">

{% if messages %}
<div class="admin-messages-container">
    {% for message in messages %}
    <div class="admin-alert admin-alert-{{ message.tags }}">
        <span>{{ message }}</span>
        <button class="admin-alert-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'admin_panel/js/admin.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
