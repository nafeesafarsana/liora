<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#F5EEE6; font-family: Georgia, serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5EEE6; padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#FAF7F2; border-radius:6px; overflow:hidden;">
          <tr>
            <td style="background-color:#4A1836; padding: 28px; text-align:center;">
              <span style="color:#E8DCCB; font-size: 26px; letter-spacing: 4px; font-family: Georgia, serif;">LIORA</span>
            </td>
          </tr>
          <tr>
            <td style="padding: 36px 40px;">
              <p style="color:#2B2B2B; font-size: 16px; margin: 0 0 16px;">{{ subject }}</p>
              <p style="color:#2B2B2B; font-size: 14px; line-height: 1.6; margin: 0 0 24px;">
                Use the verification code below to continue. This code will expire in 5 minutes.
              </p>
              <div style="text-align:center; margin: 30px 0;">
                <span style="display:inline-block; background-color:#6D214F; color:#FAF7F2; font-size: 28px; letter-spacing: 8px; padding: 14px 28px; border-radius: 4px; font-family: Arial, sans-serif;">
                  {{ code }}
                </span>
              </div>
              <p style="color:#8A3D62; font-size: 13px; line-height: 1.6; margin: 24px 0 0;">
                If you did not request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#4A1836; padding: 16px; text-align:center;">
              <span style="color:#C8A96B; font-size: 12px;">&copy; LIORA &mdash; Luxury Handbags</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
