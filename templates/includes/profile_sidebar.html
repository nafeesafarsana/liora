{% load static %}

<aside class="profile-sidebar">

    <!-- User info at top -->
    <div class="sidebar-user">
        {% if user.profile.profile_picture %}
        <img src="{{ user.profile.profile_picture.url }}"
             alt="{{ user.first_name }}"
             class="sidebar-avatar-img">
        {% else %}
        <div class="sidebar-avatar">
            {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
        </div>
        {% endif %}
        <p class="sidebar-username">{{ user.first_name }} {{ user.last_name }}</p>
        <p class="sidebar-email">{{ user.email }}</p>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <!-- PROFILE DETAILS -->
        <a href="{% url 'profile_app:profile' %}"
           class="sidebar-link {% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'edit_profile' %}active{% endif %}">
            PROFILE DETAILS
        </a>

        <!-- ADDRESSES -->
        <a href="{% url 'profile_app:address_list' %}"
           class="sidebar-link {% if 'address' in request.resolver_match.url_name %}active{% endif %}">
            ADDRESSES
        </a>

        <!-- MY ORDERS -->
        <a href="{% url 'orders:order_list' %}"
           class="sidebar-link {% if request.resolver_match.url_name == 'order_list' or request.resolver_match.url_name == 'order_detail' %}active{% endif %}">
            MY ORDERS
        </a>

        <!-- WALLET -->
        <a href="{% url 'wallet:wallet' %}"
           class="sidebar-link {% if request.resolver_match.url_name == 'wallet' %}active{% endif %}">
            WALLET
        </a>

        <!-- SECURITY (Change Password) -->
        {% if not is_google_user %}
        <a href="{% url 'profile_app:change_password' %}"
           class="sidebar-link {% if request.resolver_match.url_name == 'change_password' %}active{% endif %}">
            SECURITY
        </a>
        {% endif %}

    </nav>

</aside>
