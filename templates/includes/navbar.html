{% load static %}
<nav class="liora-navbar" id="lioraNavbar">
    <div class="navbar-inner">

        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>

        <a href="{% url 'home:home' %}" class="navbar-logo">LIORA</a>

        <div class="navbar-search">
            <input type="text" placeholder="Search handbags, clutches, totes..." class="search-input">
            <button class="search-btn" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div class="navbar-links">
            <a href="#" class="nav-link">Shop</a>
            <a href="#" class="nav-link">Collections</a>
            <a href="#" class="nav-link">About</a>
        </div>

        <div class="navbar-icons">
            <a href="#" class="icon-link" aria-label="Wishlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </a>
            <a href="#" class="icon-link" aria-label="Cart">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count">0</span>
            </a>

            {% if user.is_authenticated %}
            <a href="{% url 'profile_app:profile' %}" class="icon-link" aria-label="Profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="icon-link" aria-label="Login">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
            {% endif %}
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-search">
            <input type="text" placeholder="Search..." class="search-input">
        </div>
        <a href="#" class="mobile-link">Shop</a>
        <a href="#" class="mobile-link">Collections</a>
        <a href="#" class="mobile-link">About</a>
        {% if user.is_authenticated %}
        <a href="{% url 'profile_app:profile' %}" class="mobile-link">My Profile</a>
        <a href="{% url 'accounts:logout' %}" class="mobile-link">Logout</a>
        {% else %}
        <a href="{% url 'accounts:login' %}" class="mobile-link">Login</a>
        <a href="{% url 'accounts:signup' %}" class="mobile-link">Sign Up</a>
        {% endif %}
    </div>
</nav>
